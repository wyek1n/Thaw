name: Pi Build Unsigned DMG

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        default: pi-build/feat-macos-27-experimental-unsigned
      deployment_target:
        description: macOS deployment target
        required: true
        default: "26.0"

jobs:
  build:
    runs-on: macos-26
    env:
      APP_NAME: Thaw.app
      DMG_NAME: Thaw-feat-macos-27-experimental-unsigned.dmg
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build app without Developer ID signing
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project Thaw.xcodeproj \
            -scheme Thaw \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            MACOSX_DEPLOYMENT_TARGET=${{ inputs.deployment_target }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build
          APP_PATH="build/DerivedData/Build/Products/Release/$APP_NAME"
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "build/Thaw.app.zip"

      - name: Create DMG
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/$APP_NAME"
          STAGING="build/dmg-staging"
          rm -rf "$STAGING" "build/$DMG_NAME"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/$APP_NAME"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname Thaw \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "build/$DMG_NAME"
          shasum -a 256 "build/$DMG_NAME" "build/Thaw.app.zip" > build/SHA256SUMS.txt
          ls -lh build/$DMG_NAME build/Thaw.app.zip build/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Thaw-feat-macos-27-experimental-unsigned
          path: |
            build/Thaw-feat-macos-27-experimental-unsigned.dmg
            build/Thaw.app.zip
            build/SHA256SUMS.txt
          retention-days: 7
